# Packaging (T13, SPEC §11). Run through `npm run package` (packaging/package.ts),
# which adds the afterPack hook that flips the Electron fuses (D-17).
# The main process is fully bundled by electron-vite, so the app has no
# node_modules: `apps/desktop/package.json` lists everything as devDependencies
# (D-27).
appId: io.github.hqazi.algo
extraMetadata:
  # Linux: the .desktop file, Electron's app_id and WM_CLASS all match.
  desktopName: algo.desktop
productName: Algo
copyright: Copyright © 2026 the Algo authors
artifactName: algo-${version}-${os}-${arch}.${ext}

directories:
  output: dist
  buildResources: build

files:
  - package.json
  - out/**
  # Development checks, not part of the app.
  - '!out/main/{exec-check,security-check,storage-check,e2e-main}.js'
  - '!out/main/chunks/standin-*.js'
  - '!**/*.map'

asar: true
# Nothing native to rebuild: the main process is one bundle, and
# onnxruntime-node ships prebuilt N-API binaries (any Electron).
npmRebuild: false

extraResources:
  # Read aloud (T38, D-59): onnxruntime-node is native code, so it ships
  # outside the asar as `<resources>/onnxruntime-node`, with only the
  # binaries for the platform and architecture being built (see each
  # platform below) and its one runtime dependency.
  - from: ../../node_modules/onnxruntime-node
    to: onnxruntime-node
    filter: [package.json, LICENSE*, 'dist/**/*.js']
  - from: ../../node_modules/onnxruntime-common
    to: onnxruntime-node/node_modules/onnxruntime-common
    filter: [package.json, LICENSE*, 'dist/cjs/**/*.js', 'dist/cjs/package.json']
  # Curated problems and open-set indexes: `<resources>/content` (D-22).
  - from: ../../content
    to: content
  - from: ../../LICENSE
    to: notices/LICENSE.txt
  - from: build/notices
    to: notices

publish:
  provider: github
  owner: hqazi
  repo: algo
  # The workflow uploads to a draft; a maintainer publishes it (ticking
  # "pre-release" for a beta tag).
  releaseType: draft

mac:
  category: public.app-category.education
  extraResources:
    - from: ../../node_modules/onnxruntime-node/bin/napi-v6/darwin/${arch}
      to: onnxruntime-node/bin/napi-v6/darwin/${arch}
  target:
    - target: dmg
      arch: [x64, arm64]
    # The zip is what the macOS updater downloads.
    - target: zip
      arch: [x64, arm64]
  hardenedRuntime: true
  # Notarizes only when APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER are set.

win:
  extraResources:
    - from: ../../node_modules/onnxruntime-node/bin/napi-v6/win32/${arch}
      to: onnxruntime-node/bin/napi-v6/win32/${arch}
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

linux:
  extraResources:
    - from: ../../node_modules/onnxruntime-node/bin/napi-v6/linux/${arch}
      to: onnxruntime-node/bin/napi-v6/linux/${arch}
  # Linux only: macOS and Windows keep the product name (`Algo.app`,
  # `Algo.exe`); a top-level executableName renames those too.
  executableName: algo
  category: Education
  synopsis: Practise data structures and algorithms with an AI tutor
  description: Practise data structures and algorithms with an AI tutor.
  syncDesktopName: true
  maintainer: Algo <https://github.com/hqazi/algo>
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
