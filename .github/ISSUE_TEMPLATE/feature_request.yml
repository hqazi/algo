name: Feature request
description: An idea for the app, the tutor or the problems.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or the situation, more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could the app help?
