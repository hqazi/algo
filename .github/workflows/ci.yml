name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Every curated problem validates and its reference passes in Pyodide.
      - run: npm run validate:content
      - run: npm run build
      # The real execution host in Electron (CSP, network blocking, timeouts).
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox uses.
      - name: check execution host
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a npm run check:exec-host
      # The UI window's security baseline: CSP, IPC validation, blocked
      # navigation and remote content, no Node in the renderer.
      - name: check security baseline
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run check:security
      # The practice flow in the real app (T08): next problem, run, an edit
      # from another editor, submit, progress, theme.
      - name: end-to-end practice smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run e2e
      # SQLite storage inside the real Electron main process: better-sqlite3's
      # prebuilt binary loads under Electron's Node, migrations and settings work.
      - name: check storage under Electron
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm run check:storage; else npm run check:storage; fi
      # Flip the packaged-build fuses on a copy of Electron and read them back.
      - run: npm run check:fuses
      # Package the app (unpacked, fuses flipped) and start it: problems load
      # from <resources>/content and Python runs from app.asar (T13).
      - name: package and smoke test
        if: runner.os == 'Linux'
        run: |
          npm run package:dir
          xvfb-run -a npx tsx apps/desktop/packaging/smoke.ts apps/desktop/dist/linux-unpacked/algorithm-tutor

  # Rust and Go harnesses (T15) with the toolchains preinstalled on the runner
  # image: hand-written solutions pass, failure modes, every type round-trips,
  # golden projects compile.
  harnesses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: cargo --version && go version
      - run: npm run check:harnesses

  # Container executor (T17) with the runner's Docker: builds a local stand-in
  # for the runner image (never pushed) and runs the real-Docker suite: pass,
  # timeout, no network, cleanup.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: docker version
      - run: docker build -t algorithm-tutor-runner:test apps/desktop/src/main/exec/container/test-image
      - run: npx vitest run apps/desktop/src/main/exec/container apps/desktop/src/main/runtimes
        env:
          ALGOTUTOR_TEST_RUNNER_IMAGE: algorithm-tutor-runner:test
