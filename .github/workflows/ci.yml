name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Every curated problem validates and its reference passes in Pyodide.
      - run: npm run validate:content
      - run: npm run build
      # The real execution host in Electron (CSP, network blocking, timeouts).
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox uses.
      - name: check execution host
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a npm run check:exec-host
      # The UI window's security baseline: CSP, IPC validation, blocked
      # navigation and remote content, no Node in the renderer.
      - name: check security baseline
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run check:security
      # SQLite storage inside the real Electron main process: better-sqlite3's
      # prebuilt binary loads under Electron's Node, migrations and settings work.
      - name: check storage under Electron
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm run check:storage; else npm run check:storage; fi
      # Flip the packaged-build fuses on a copy of Electron and read them back.
      - run: npm run check:fuses
